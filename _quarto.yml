project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
  resources:
    - "ink/*.js"
    - "ink/vendor/*.js"
    - "ink/figures/*"

website:
  title: "Analytics Modeling From Scratch"
  description: "Step-by-step analytics modeling walkthroughs for learners who want the formulas, code, and intuition together."
  site-url: "https://brettwhite-git.github.io/analytics-modeling/"
  repo-url: "https://github.com/brettwhite-git/analytics-modeling"
  search: false

# Quarto is the engine only: it runs the R, typesets the maths and highlights the code.
# Every tag of the page comes from ink/template.html, and all styling from ink/site.css.
filters:
  - at: pre-ast
    path: ink/reveal.lua

format:
  html:
    template: ink/template.html
    theme: none
    minimal: true
    section-divs: true
    toc: false
    code-fold: true
    code-summary: "The R"
    html-math-method: katex
    highlight-style: none
    css:
      - ink/site.css
      - ink/ink-kit.css

# The contents of the site. The template draws the left-hand contents from this list;
# ink/ink.js uses the same markup for the breadcrumb and the previous / next links.
ink-parts:
  - title: "Classification"
    chapters:
      - { href: "svm-from-scratch.html", title: "Support vector machines" }
      - { href: "knn-from-scratch.html", title: "K nearest neighbours" }
  - title: "Validation"
    chapters:
      - { href: "cross-validation-from-scratch.html", title: "Cross-validation" }
  - title: "Clustering"
    chapters:
      - { href: "kmeans-from-scratch.html", title: "K-means" }
  - title: "Change detection"
    chapters:
      - { href: "cusum-from-scratch.html", title: "CUSUM" }
  - title: "Time series"
    chapters:
      - { href: "time-series-from-scratch.html", title: "Smoothing, ARIMA and GARCH" }
  - title: "Regression"
    chapters:
      - { href: "regression-from-scratch.html", title: "Linear and logistic regression" }
  - title: "Transformations"
    chapters:
      - { href: "pca-boxcox-from-scratch.html", title: "PCA and Box-Cox" }
  - title: "Trees"
    chapters:
      - { href: "cart-from-scratch.html", title: "CART" }
  - title: "Variable selection"
    chapters:
      - { href: "variable-selection-from-scratch.html", title: "LASSO, ridge and stepwise" }
  - title: "Design of experiments"
    chapters:
      - { href: "doe-from-scratch.html", title: "A/B tests, factorials and bandits" }
  - title: "Simulation"
    chapters:
      - { href: "simulation-markov-from-scratch.html", title: "Queues and Markov chains" }
  - title: "Missing data"
    chapters:
      - { href: "missing-data-from-scratch.html", title: "Imputation" }
  - title: "Optimization"
    chapters:
      - { href: "optimization-from-scratch.html", title: "Linear and integer programs" }
  - title: "Beyond the basics"
    chapters:
      - { href: "advanced-topics-from-scratch.html", title: "Advanced topics" }
  - title: "Practice"
    chapters:
      - { href: "comprehensive-quiz.html", title: "Comprehensive quiz" }
      - { href: "binary-choice-drill.html", title: "Binary choice drill" }
      - { href: "confusion-matrix-drill.html", title: "Confusion matrix drill" }
