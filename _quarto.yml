project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
  post-render:
    - ink/prune.R
  resources:
    - "ink/*.js"
    - "ink/vendor/*.js"
    - "ink/figures/*"

website:
  title: "Analytics Modeling From Scratch"
  description: "Step-by-step analytics modeling walkthroughs for learners who want the formulas, code, and intuition together."
  site-url: "https://brettwhite-git.github.io/analytics-modeling/"
  repo-url: "https://github.com/brettwhite-git/analytics-modeling"
  search: false

# Quarto is the engine only: it runs the R, typesets the maths and highlights the code.
# Every tag of the page comes from ink/template.html, and all styling from ink/site.css.
# R draws every plot twice: as SVG (which ink/plots.lua puts in the page and ink/ink-plot.js re-inks by hand)
# and as PNG (the fallback for a plot too dense to redraw).
knitr:
  opts_chunk:
    dev: [svglite, png]
    dpi: 200

filters:
  - at: pre-ast
    path: ink/reveal.lua
  - at: pre-ast
    path: ink/plots.lua

format:
  html:
    template: ink/template.html
    theme: none
    minimal: true
    section-divs: true
    toc: false
    code-fold: true
    code-summary: "The R"
    html-math-method: katex
    highlight-style: none
    css:
      - ink/site.css
      - ink/ink-kit.css

# The contents of the site: a few chapters, each a group of lessons, in the order to read them,
# from the simplest idea to the hardest. The template draws the left-hand contents from this list;
# ink/ink.js uses the same markup for the breadcrumb, the lesson number and the previous / next links.
ink-parts:
  - title: "Foundations"
    chapters:
      - { href: "points-and-distance.html", title: "Points and distance" }
      - { href: "a-better-guess.html", title: "A better guess" }
  - title: "Predicting a number"
    chapters:
      - { href: "regression-from-scratch.html", title: "Fitting a line" }
      - { href: "variable-selection-from-scratch.html", title: "Choosing what to keep" }
  - title: "Sorting into classes"
    chapters:
      - { href: "knn-from-scratch.html", title: "Nearest neighbours" }
      - { href: "svm-from-scratch.html", title: "The widest gap" }
      - { href: "cart-from-scratch.html", title: "Decision trees" }
  - title: "Trusting a model"
    chapters:
      - { href: "cross-validation-from-scratch.html", title: "Testing on unseen data" }
  - title: "Finding structure"
    chapters:
      - { href: "kmeans-from-scratch.html", title: "Finding groups" }
      - { href: "pca-boxcox-from-scratch.html", title: "Reshaping data" }
      - { href: "missing-data-from-scratch.html", title: "Missing values" }
  - title: "Data over time"
    chapters:
      - { href: "cusum-from-scratch.html", title: "Spotting a change" }
      - { href: "time-series-from-scratch.html", title: "Forecasting" }
  - title: "Deciding"
    chapters:
      - { href: "doe-from-scratch.html", title: "Running an experiment" }
      - { href: "simulation-markov-from-scratch.html", title: "Simulating chance" }
      - { href: "optimization-from-scratch.html", title: "The best plan" }
      - { href: "advanced-topics-from-scratch.html", title: "Beyond the basics" }
